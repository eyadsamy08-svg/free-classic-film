<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Classic Films</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; line-height: 1.5; }
  header { padding: 1.5rem; text-align: center; background: #1b1b1b; }
  header h1 { font-size: 2rem; }
  header p { color: #aaa; }
  main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }

  /* Player */
  .player { aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: .75rem; }
  .player iframe { width: 100%; height: 100%; border: 0; }
  #now { margin-bottom: 2rem; font-size: 1.2rem; font-weight: 600; }

  /* Film list */
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
  .card { background: #1e1e1e; border: 2px solid transparent; border-radius: 10px; padding: 1.25rem 1rem;
          color: inherit; text-align: left; cursor: pointer; font: inherit; }
  .card:hover { background: #2a2a2a; }
  .card.active { border-color: #f4b942; }
  .card h3 { font-size: 1.05rem; }
  .card p { color: #aaa; font-size: .9rem; }

  footer { text-align: center; padding: 2rem; color: #777; font-size: .9rem; }
</style>
</head>
<body>

<header>
  <h1>Free Classic Films</h1>
  <p>Public-domain movies you can watch for free.</p>
</header>

<main>
  <div class="player">
    <iframe id="video" src="" allowfullscreen title="Film player"></iframe>
  </div>
  <div id="now"></div>

  <div class="list" id="list"></div>
</main>

<footer>Only add films that are in the public domain or that you have permission to show.</footer>

<script>
  // Add your films here: title, year, and an embed link.
  // Internet Archive embed format: https://archive.org/embed/ITEM_ID
  const films = [
    { title: "Night of the Living Dead", year: 1968, src: "https://archive.org/embed/night_of_the_living_dead" },
    { title: "His Girl Friday",         year: 1940, src: "https://archive.org/embed/his_girl_friday" },
    { title: "A Trip to the Moon",      year: 1902, src: "https://archive.org/embed/A_Trip_to_the_Moon" }
  ];

  const list = document.getElementById("list");
  const video = document.getElementById("video");
  const now = document.getElementById("now");

  function play(film, card) {
    video.src = film.src;
    now.textContent = "Now playing: " + film.title + " (" + film.year + ")";
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
    card.classList.add("active");
  }

  films.forEach((film, i) => {
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = "<h3>" + film.title + "</h3><p>" + film.year + "</p>";
    card.addEventListener("click", () => play(film, card));
    list.appendChild(card);
    if (i === 0) play(film, card);
  });
</script>

</body>
</html>
